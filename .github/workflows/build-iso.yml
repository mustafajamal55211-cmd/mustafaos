name: Build mustafaos ISO
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          docker image prune -af
      - name: Echte Debian Trixie ISO bauen
        run: |
          docker run --rm --privileged -v "$PWD:/work" -w /work debian:trixie bash -e -c '
            export DEBIAN_FRONTEND=noninteractive
            sed -i "s/Components: main/Components: main contrib non-free non-free-firmware/g" /etc/apt/sources.list.d/debian.sources
            apt-get update
            apt-get install -y live-build squashfs-tools xorriso isolinux syslinux-common dosfstools mtools
            rm -rf config auto .build binary chroot cache
            lb config --distribution trixie --architectures amd64 --linux-flavours amd64 --binary-images iso-hybrid --archive-areas "main contrib non-free non-free-firmware" --bootappend-live "boot=live components locales=de_DE.UTF-8 keyboard-layouts=de quiet splash"
            mkdir -p config/package-lists
            printf "%s\n" live-boot live-config live-config-systemd systemd-sysv sudo locales console-setup keyboard-configuration network-manager xorg lightdm lightdm-gtk-greeter udisks2 gvfs pulseaudio pulseaudio-module-bluetooth > config/package-lists/custom.list.chroot
            while IFS= read -r pkg || [ -n "$pkg" ]; do
              pkg=$(echo "$pkg" | tr -d "\r" | xargs)
              [ -z "$pkg" ] && continue
              apt-cache show "$pkg" >/dev/null 2>&1 && echo "$pkg" >> config/package-lists/custom.list.chroot || true
            done < packages.txt
            mkdir -p config/includes.chroot/etc/default config/includes.chroot/etc/sysctl.d
            echo "mustafaos" > config/includes.chroot/etc/hostname
            printf "%s\n" "ALGO=lz4" "PERCENT=50" "PRIORITY=100" > config/includes.chroot/etc/default/zramswap
            printf "%s\n" "vm.swappiness=100" "vm.vfs_cache_pressure=50" > config/includes.chroot/etc/sysctl.d/99-speed.conf
            lb build
          '
      - name: ISO als Release hochladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISO_FILE=$(ls -1 live-image-*.iso | head -n1)
          mv "$ISO_FILE" "mustafaos.iso"
          TAG="build-${{ github.run_number }}"
          SIZE=$(stat -c%s "mustafaos.iso")
          if [ "$SIZE" -gt 2000000000 ]; then
            split -b 1800M -d "mustafaos.iso" "mustafaos.iso.part-"
            gh release create "$TAG" mustafaos.iso.part-* --title "mustafaos ($TAG)" --notes "Gebaut mit Mustafa Factory!"
          else
            gh release create "$TAG" "mustafaos.iso" --title "mustafaos ($TAG)" --notes "Gebaut mit Mustafa Factory!"
          fi
